<div *ngIf="defaultAccount" class="balance-card">
    <h4>Default Card:</h4>

    <div>
        {{ defaultAccount.accountType | titlecase }}
    </div>
    <div>
        {{ defaultAccount.accountNumber }}
    </div>
    <div>
        {{ defaultAccount.balance | currency: defaultAccount.currency }}
    </div>
</div>

<div *ngIf="error">
    {{ error }}
</div>
