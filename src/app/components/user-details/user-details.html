<div class="container container-top-margin">
    <div class="row">
        <div class="col-sm-12">

            <div class="title">Profile Information</div>

            <div class="profile-header">
                <a class="profile-icon" aria-label="Profile">
                    <i class="fa fa-user"></i>
                </a>
            </div>

            <div class="user-menu-container" *ngIf="isLoggedIn">

                <button class="btn btn-light" (click)="toggleUserMenu()">
                    ⚙️ Manage Account
                </button>

                <div class="user-dropdown" *ngIf="showUserMenu">
                    <button class="dropdown-item" (click)="editUser(); closeUserMenu()">Edit Details</button>
                    <button class="dropdown-item" (click)="changePassword(); closeUserMenu()">Change Password</button>
                    <button class="dropdown-item" (click)="logout(); closeUserMenu()">Log out</button>
                </div>

            </div>

            @if (error && !showEditModal) {
            <div class="alert alert-danger mb-3">
                {{ error }}
            </div>
            }

            @for(user of user_list; track user.firstName) {
            <div class="user-details-content mb-3">
                <div class="user-name-box text-dark">
                    {{ user.firstName }} {{ user.lastName }}
                </div>
                <div class="user-details-box text-dark">
                    <b>Email:</b> {{ user.email }}<br>
                    <b>Phone:</b> {{ user.phone }}<br>
                    <b>Address:</b> {{ user.address }}<br>
                    <b>DOB:</b> {{ user.DOB }}
                </div>
            </div>
            }

            <div *ngIf="changePasswordModal" (click)="changePasswordModal = false" class="overlay">
                <div class="modal-card" (click)="$event.stopPropagation()">
                    <h2>Change Password</h2>

                    <form (ngSubmit)="submitPasswordChange()" #passwordForm="ngForm">

                        <div class="form-group">
                            <label for="currentPassword">Current Password:</label>
                            <div class="password-wrapper">
                                <input [type]="showPassword ? 'text' : 'password'" id="currentPassword"
                                    [(ngModel)]="currentPassword" name="currentPassword"
                                    placeholder="Enter your current password" required>
                                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    (click)="togglePasswordVisibility()"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="newPassword">New Password:</label>
                            <div class="password-wrapper">
                                <input [type]="showPassword ? 'text' : 'password'" id="newPassword"
                                    [(ngModel)]="newPassword" name="newPassword" placeholder="Enter your new password"
                                    required>
                                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    (click)="togglePasswordVisibility()"></i>
                            </div>
                        </div>

                        <button type="submit" [disabled]="passwordForm.invalid">
                            Change Password
                        </button>

                        <button type="button" class="close-btn" (click)="changePasswordModal = false">
                            Cancel
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="overlay" *ngIf="showEditModal" (click)="showEditModal = false">
    <div class="modal-card" (click)="$event.stopPropagation()">
        <h2>Edit Profile</h2>

        <form (ngSubmit)="submitEdit()" #editForm="ngForm">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" [(ngModel)]="editFirstName" name="firstName"
                    placeholder="Enter your first name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" [(ngModel)]="editLastName" name="lastName"
                    placeholder="Enter your last name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" [(ngModel)]="editEmail" name="email" placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" [(ngModel)]="editPhone" name="phone" placeholder="Enter your phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" [(ngModel)]="editAddress" name="address"
                    placeholder="Enter your address" required>
            </div>

            <button type="submit">Save Changes</button>

            <button type="button" class="close-btn" (click)="showEditModal = false">
                Cancel
            </button>

            <div *ngIf="error" class="error-message">
                {{ error }}
            </div>

        </form>
    </div>
</div>
