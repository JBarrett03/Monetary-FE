<div class="card-preview" [class.complete]="cardComplete" (click)="goToAccounts()" style="cursor: pointer;">
    <div class="brand">{{ cardBrand | uppercase }}</div>

    <div class="number">{{ maskedAccountNumber }}</div>

    <div class="expiry">MM / YY</div>
</div>

<div class="stripe-input">
    <div id="card-element"></div>
</div>

<button (click)="pay()" [disabled]="!cardComplete">
    Pay
</button>
