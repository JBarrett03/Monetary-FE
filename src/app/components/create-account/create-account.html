<div class="overlay" *ngIf="showCreateAccountModal" (click)="closeCreateAccount()">
    <div class="modal-card" (click)="$event.stopPropagation()">
        <h2>Sign Up</h2>

        <form (ngSubmit)="onSubmit()" #createAccountForm="ngForm">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" [(ngModel)]="firstName" name="firstName"
                    placeholder="Enter your first name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" [(ngModel)]="lastName" name="lastName"
                    placeholder="Enter your last name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" [(ngModel)]="phone" name="phone" placeholder="Enter your phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" [(ngModel)]="address" name="address" placeholder="Enter your address"
                    required>
            </div>

            <div class="form-group">
                <label for="DOB">Date of Birth:</label>
                <input type="text" id="DOB" [(ngModel)]="DOB" name="DOB" placeholder="Enter your date of birth"
                    required>
            </div>

            <p>Already have an account? <a routerLink="/login">Login here</a></p>

            <button type="submit" [disabled]="!createAccountForm.form.valid">Sign Up</button>

            <button type="button" class="close-btn" (click)="closeCreateAccount()">
                Cancel
            </button>

        </form>
    </div>
</div>
