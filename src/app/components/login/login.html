<div class="overlay" *ngIf="showLoginModal" (click)="closeLogin()">
    <div class="modal-card" (click)="$event.stopPropagation()">
        <h2>Login</h2>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" [(ngModel)]="email" required #emailCtrl="ngModel">
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" [(ngModel)]="password" required #passwordCtrl="ngModel">
            </div>

            <p>Don't have an account? <a routerLink="/create-account">Register here</a></p>

            <button type="submit" [disabled]="loginForm.invalid">
                Login
            </button>

            <button type="button" class="close-btn" (click)="closeLogin()">
                Cancel
            </button>

            <div *ngIf="errorMessage" class="error-box">
                {{ errorMessage }}
            </div>

        </form>

    </div>
</div>
