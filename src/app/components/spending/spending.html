<div class="toggle-container">
    <button class="toggle-btn" [class.active]="activeView === 'savings'" (click)="showSavings()">
        Savings
    </button>
    <button class="toggle-btn" [class.active]="activeView === 'spent'" (click)="showSpent()">
        Spending
    </button>
</div>

<div class="slide-panel" [class.open]="activeView !== null">
    <div class="panel-header">
        <button class="close-btn" (click)="closeView()">X</button>
    </div>

    <div class="panel-content">
        <div *ngIf="activeView === 'savings'">
            <div class="period-actions">
                <mat-form-field appearance="fill">
                    <mat-label>Period</mat-label>
                    <mat-select (selectionChange)="onChange($event)">
                        <mat-option *ngFor="let period of period_list" [value]="period">{{ period }}</mat-option>
                    </mat-select>
                </mat-form-field>
                <button class="btn btn-primary">Export Data</button>
            </div>
            <h2 class="panel-title">Total Savings</h2>
            <app-pie mode="savings" [primaryValue]="primaryValue" [remainingValue]="remainingValue"></app-pie>
        </div>
        <div *ngIf="activeView === 'spent'">
            <div class="period-actions">
                <mat-form-field appearance="fill">
                    <mat-label>Period</mat-label>
                    <mat-select (selectionChange)="onChange($event)">
                        <mat-option *ngFor="let period of period_list" [value]="period">{{ period }}</mat-option>
                    </mat-select>
                </mat-form-field>
                <button class="btn btn-primary">Export Data</button>
            </div>
            <h2 class="panel-title">Total Spending</h2>
            <app-pie mode="spent" [primaryValue]="primaryValue" [remainingValue]="remainingValue"></app-pie>
        </div>
    </div>
</div>
