<div class="toggle-container">
    <button class="toggle-btn" [class.active]="activeView === 'savings'" (click)="showSavings()">
        Savings
    </button>
    <button class="toggle-btn" [class.active]="activeView === 'spent'" (click)="showSpent()">
        Spending
    </button>
</div>

<div class="slide-panel" [class.open]="activeView !== null">
    <div class="panel-header">
        <button class="close-btn" (click)="closeView()">X</button>
    </div>

    <div class="panel-content">
        <div *ngIf="activeView === 'savings'">
            <h2 style="text-align: center;">Total Savings:</h2>
        </div>
        <div *ngIf="activeView === 'spent'">
            <h2 style="text-align: center;">Total Spending:</h2>
            Period
            <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions" [callbackFunction]="chartCallback"
                style="width: 100%; height: 400px; display: block;"></highcharts-chart>
        </div>
        <button class="btn btn-primary">Export Data</button>
    </div>
</div>
